name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/flux-image-editor", "feature/flux-image-editor-phase2" ]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'
  pull_request:
    branches: [ "main", "feature/flux-image-editor", "feature/flux-image-editor-phase2" ]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Run Android lint
        id: android_lint
        continue-on-error: true
        run: ./gradlew app:lintDebug --continue
      - name: Print complete lint report
        if: always()
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          else
            echo "Lint text report was not generated."
          fi
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            Android/src/app/build/reports/lint-results-debug.html
            Android/src/app/build/reports/lint-results-debug.xml
            Android/src/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flux-image-editor-debug-apk
          path: Android/src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Fail when lint failed
        if: steps.android_lint.outcome == 'failure'
        working-directory: .
        run: exit 1


